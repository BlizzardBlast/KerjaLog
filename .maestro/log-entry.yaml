- inputText: "Prepared the weekly status report before the team deadline."
- back
- assertVisible: "What happened at work?"
- tapOn: "Describe what happened"
- assertVisible: "Prepared the weekly status report before the team deadline."
- tapOn: "Find the outcome"
- tapOn: "A deadline was met"
- tapOn: "Add supporting evidence"
- tapOn: "Skip evidence"
- assertVisible: "What does this demonstrate?"
- tapOn: "Execution"
- tapOn: "Review my impact"
- assertVisible: "See the value inside the work"
- tapOn: "Confirm & save"
- assertVisible: "Saved work entry"
- assertVisible: "Prepared the weekly status report before the team deadline."
- assertVisible: "Execution"
- tapOn: "Back to Home"
- assertVisible: "Prepared the weekly status report before the team deadline"
- tapOn: "Growth"
- assertVisible: "Your evidence map"
- assertVisible: "Evidence across 1 skill area"
- assertVisible: "Execution"
- assertVisible: "1 entry"
- tapOn: "Execution"
- assertVisible: "Skill evidence"
