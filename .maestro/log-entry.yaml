appId: com.blizzardblast.kerjalog
name: Core Log entry journey
---
- launchApp:
    clearState: true
- assertVisible: "Turn everyday work into evidence of progress"
- tapOn: "Set up KerjaLog"
- tapOn: "Technology & Product"
- tapOn: "Junior individual contributor"
- tapOn: "Continue"
- tapOn: "Remember what I worked on"
- tapOn: "Continue"
- tapOn: "Within the next 3 months"
