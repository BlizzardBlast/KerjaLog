name: Jest open handles diagnostic

on:
  push:
    branches:
      - feat/work-entry-refinement

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect Jest open handles
        run: pnpm exec jest --ci --runInBand --detectOpenHandles
