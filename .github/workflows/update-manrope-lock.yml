name: Update Manrope lockfile

on:
  push:
    branches:
      - feat/onboarding-foundation

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/onboarding-foundation

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: pnpm

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/update-manrope-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/update-manrope-lock.yml
          git commit -m "chore: update lockfile for Manrope"
          git push origin HEAD:feat/onboarding-foundation
