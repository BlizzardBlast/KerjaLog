name: Sync onboarding design dependencies

on:
  push:
    branches:
      - feat/onboarding-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/onboarding-foundation

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Sync lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Update localized onboarding copy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/i18n/translations.ts';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(search, replacement) {
            if (!source.includes(search)) {
              throw new Error(`Expected translation marker not found: ${search}`);
            }
            source = source.replace(search, replacement);
          }

          replaceOnce(
            "  'common.action.startSetup': 'Set up KerjaLog',\n",
            "  'common.action.startSetup': 'Set up KerjaLog',\n  'common.action.openSettings': 'Open settings',\n  'common.theme.switchToDark': 'Switch to dark theme',\n  'common.theme.switchToLight': 'Switch to light theme',\n",
          );
          replaceOnce(
            "  'onboarding.language.indonesian': 'Bahasa Indonesia',\n",
            "  'onboarding.language.indonesian': 'Bahasa Indonesia',\n  'onboarding.language.change': 'Change language',\n",
          );
          replaceOnce(
            "  'onboarding.review.weeklyReminderDescription':\n    'A short reminder to capture what moved forward that week.',\n",
            "  'onboarding.review.weeklyReminderDescription':\n    'A local reminder every Friday at 16:30. You can turn it off later.',\n  'onboarding.review.notificationChannelName': 'Weekly reflection',\n  'onboarding.review.notificationTitle': 'A gentle weekly check-in',\n  'onboarding.review.notificationBody':\n    'What did you finish, help with, solve, or learn this week?',\n  'onboarding.review.notificationPermissionTitle': 'Notifications are off',\n  'onboarding.review.notificationPermissionDescription':\n    'KerjaLog asks for notification permission only when you enable this local reminder. You can enable it in system settings.',\n  'onboarding.review.notificationSetupTitle':\n    'Reminder could not be scheduled',\n  'onboarding.review.notificationSetupDescription':\n    'Your setup is safe, but KerjaLog could not create the local weekly reminder. Try again later.',\n",
          );

          replaceOnce(
            "  'common.action.startSetup': 'Atur KerjaLog',\n",
            "  'common.action.startSetup': 'Atur KerjaLog',\n  'common.action.openSettings': 'Buka pengaturan',\n  'common.theme.switchToDark': 'Ganti ke tema gelap',\n  'common.theme.switchToLight': 'Ganti ke tema terang',\n",
          );
          replaceOnce(
            "  'onboarding.language.indonesian': 'Bahasa Indonesia',\n\n  'onboarding.welcome.eyebrow': 'Pendamping perkembangan kerja pribadi',\n",
            "  'onboarding.language.indonesian': 'Bahasa Indonesia',\n  'onboarding.language.change': 'Ganti bahasa',\n\n  'onboarding.welcome.eyebrow': 'Pendamping perkembangan kerja pribadi',\n",
          );
          replaceOnce(
            "  'onboarding.review.weeklyReminderDescription':\n    'Pengingat singkat untuk mencatat apa yang bergerak maju minggu itu.',\n",
            "  'onboarding.review.weeklyReminderDescription':\n    'Pengingat lokal setiap Jumat pukul 16.30. Anda dapat mematikannya nanti.',\n  'onboarding.review.notificationChannelName': 'Refleksi mingguan',\n  'onboarding.review.notificationTitle': 'Waktunya check-in mingguan',\n  'onboarding.review.notificationBody':\n    'Apa yang Anda selesaikan, bantu, pecahkan, atau pelajari minggu ini?',\n  'onboarding.review.notificationPermissionTitle': 'Notifikasi belum aktif',\n  'onboarding.review.notificationPermissionDescription':\n    'KerjaLog hanya meminta izin notifikasi saat Anda mengaktifkan pengingat lokal ini. Anda dapat mengaktifkannya melalui pengaturan sistem.',\n  'onboarding.review.notificationSetupTitle':\n    'Pengingat belum dapat dijadwalkan',\n  'onboarding.review.notificationSetupDescription':\n    'Pengaturan Anda tetap aman, tetapi KerjaLog belum dapat membuat pengingat mingguan lokal. Coba lagi nanti.',\n",
          );

          fs.writeFileSync(path, source);
          NODE

      - name: Format generated changes
        run: pnpm format -- src/i18n/translations.ts package.json pnpm-lock.yaml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/translations.ts package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync notification dependency and copy [skip ci]"
          git push origin HEAD:feat/onboarding-foundation
