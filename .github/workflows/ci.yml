name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:ci

      - name: Expo Doctor
        run: pnpm run expo:doctor

      - name: Verify generated native configuration
        run: |
          pnpm exec expo prebuild --clean --no-install
          grep -q 'resourceValues.isExcludedFromBackup = true' ios/*/AppDelegate.swift
          grep -q '"expo.sqlite.useSQLCipher": "true"' ios/Podfile.properties.json
          grep -q 'expo.sqlite.useSQLCipher=true' android/gradle.properties

      - name: Export Android bundle
        run: pnpm run export:android

      - name: Export iOS bundle
        run: pnpm run export:ios
