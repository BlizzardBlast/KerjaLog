name: Validate work entry refinement

on:
  push:
    branches:
      - feat/work-entry-refinement

permissions:
  contents: write

jobs:
  validate-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install and regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Align architecture docs with refinement implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('README.md', 'docs/PRODUCT_AND_ARCHITECTURE.md'):
              path = Path(filename)
              text = path.read_text()
              text = text.replace('React Hook Form', 'TanStack Form')
              text = text.replace('react-hook-form', '@tanstack/react-form')
              path.write_text(text)

          path = Path('docs/PRODUCT_AND_ARCHITECTURE.md')
          text = path.read_text()
          text = text.replace(
              '| Forms                | `@tanstack/react-form`                               | Efficient form/wizard state                           |',
              '| Forms                | `@tanstack/react-form`                       | Efficient form/wizard state                           |',
          )
          text = text.replace(
              'entry_id\nskill_id\nsource\nconfirmed\n```\n\n`source` can distinguish a user-selected skill from a rules-based suggestion.',
              'entry_id\nskill_id\nsource\n```\n\n`source` distinguishes a user-selected skill from a rules-based suggestion. Only confirmed relationships are persisted; unconfirmed rule suggestions remain derived UI state.',
          )
          path.write_text(text)
          PY

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: React Compiler healthcheck
        run: pnpm run compiler:check

      - name: Check render ref purity
        run: pnpm run react:refs:check

      - name: Verify initial SQLite schema
        run: pnpm run schema:check

      - name: Test
        run: pnpm test:ci

      - name: Commit generated lockfile, docs, and formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/PRODUCT_AND_ARCHITECTURE.md package.json pnpm-lock.yaml scripts src tests
          git commit -m "chore: materialize refinement dependencies and formatting"
          git push
