name: Sync expo-file-system dependency

on:
  push:
    branches:
      - feat/log
    paths:
      - .github/workflows/sync-expo-file-system-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/log

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Add Expo FileSystem
        run: pnpm add expo-file-system@~57.0.2

      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: add expo file system"
          git push origin HEAD:feat/log
