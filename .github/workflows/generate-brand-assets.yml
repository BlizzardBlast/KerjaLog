name: Generate KerjaLog brand assets

on:
  push:
    branches:
      - main
    paths:
      - scripts/generate_brand_assets.py
      - .github/workflows/generate-brand-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate brand assets
        env:
          KERJALOG_CI_GENERATE: "1"
        run: python scripts/generate_brand_assets.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json assets scripts/generate_brand_assets.py .github/workflows/generate-brand-assets.yml
          git commit -m "feat: add KerjaLog app branding"
          git push origin HEAD:main
