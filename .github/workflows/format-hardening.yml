name: Format hardening branch

on:
  push:
    branches:
      - feat/work-entry-refinement

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/work-entry-refinement
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Biome formatting
        run: pnpm format
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Biome formatting"
            git push origin HEAD:feat/work-entry-refinement
          fi
      - name: Typecheck formatted tree
        run: pnpm typecheck
