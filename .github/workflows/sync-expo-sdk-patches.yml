name: Sync Expo SDK patches

on:
  push:
    branches:
      - feat/log
    paths:
      - .github/workflows/sync-expo-sdk-patches.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/log

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          cache: pnpm

      - name: Install current dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Expo SDK patch versions
        run: |
          pnpm add @expo/ui@~57.0.10 expo@~57.0.12 expo-constants@~57.0.10 expo-notifications@~57.0.10 expo-router@~57.0.12 expo-splash-screen@~57.0.6
          pnpm add -D jest-expo@~57.0.4

      - name: Commit dependency sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync Expo SDK patch versions"
          git push origin HEAD:feat/log
