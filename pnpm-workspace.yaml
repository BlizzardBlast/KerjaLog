# Keep pnpm's isolated dependency semantics while moving its virtual store closer
# to the repository root. This shortens Windows CMake/Ninja source paths without
# changing Metro's runtime dependency resolution topology.
nodeLinker: isolated
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 24

# Keep Expo native modules on the single SDK-compatible constants release even
# when an older package manifest still points at the previous patch version.
overrides:
  expo-constants: 57.0.18

# pnpm 11 blocks dependency lifecycle scripts unless they are explicitly trusted.
# Sentry's CLI requires its install script to provision the platform binary used
# for source maps, debug symbols, build events, and Size Analysis.
allowBuilds:
  '@sentry/cli': true

# pnpm 11 applies a one-day release-age gate by default. Keep narrow exact-version
# exceptions for packages already required by the committed Expo SDK lockfile
# instead of disabling supply-chain verification globally.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/config@57.0.7'
  - '@expo/fingerprint@0.20.13'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.12'
  - '@expo/metro-runtime@57.0.12'
  - '@expo/prebuild-config@57.0.16'
  - '@expo/ui@57.0.18'
  - 'caniuse-lite@1.0.30001809'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-notifications@57.0.19
  - expo-router@57.0.21
  - 'expo-server@57.0.2'
  - expo-splash-screen@57.0.9
  - expo@57.0.23
