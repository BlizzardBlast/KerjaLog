# Keep Expo native modules on the single SDK-compatible constants release even
# when an older package manifest still points at the previous patch version.
overrides:
  expo-constants: 57.0.16

# pnpm 11 blocks dependency lifecycle scripts unless they are explicitly trusted.
# Sentry's CLI requires its install script to provision the platform binary used
# for source maps, debug symbols, build events, and Size Analysis.
allowBuilds:
  '@sentry/cli': true

# pnpm 11 applies a one-day release-age gate by default. Keep narrow exact-version
# exceptions for packages already required by the committed Expo SDK lockfile
# instead of disabling supply-chain verification globally.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.14 || 57.0.17'
  - '@expo/config@57.0.7'
  - '@expo/fingerprint@0.20.7 || 0.20.9'
  - '@expo/inline-modules@0.1.5'
  - '@expo/local-build-cache-provider@57.0.6 || 57.0.7'
  - '@expo/metro-config@57.0.8 || 57.0.9'
  - '@expo/metro-runtime@57.0.9 || 57.0.12'
  - '@expo/prebuild-config@57.0.11 || 57.0.13'
  - '@expo/ui@57.0.12 || 57.0.14'
  - 'caniuse-lite@1.0.30001809'
  - expo-asset@57.0.10 || 57.0.13
  - 'expo-constants@57.0.13 || 57.0.16'
  - 'expo-notifications@57.0.13 || 57.0.15'
  - 'expo-router@57.0.15 || 57.0.17'
  - 'expo-server@57.0.2'
  - 'expo-splash-screen@57.0.6'
  - 'expo@57.0.15 || 57.0.18'
  - 'jest-expo@57.0.4 || 57.0.5'
  - 'update-browserslist-db@1.3.0'
  - '@expo/router-server@57.0.7'
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo-dev-client@57.0.14 || 57.0.16
  - expo-dev-launcher@57.0.14
  - expo-dev-menu@57.0.14
  - expo-linking@57.0.7 || 57.0.8
  - expo-crypto@57.0.2
  - expo-font@57.0.2
  - expo-secure-store@57.0.2
  - expo-splash-screen@57.0.8
  - expo-sqlite@57.0.2
  - expo-system-ui@57.0.3
  - react-native@0.86.3
